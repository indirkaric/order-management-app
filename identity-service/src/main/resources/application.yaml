server:
  port: 8081

spring:
  application:
    name: identity-service

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://auth.oms.local:8080/realms/order-management

  datasource:
    url: jdbc:postgresql://database.oms.local:5432/identity_db
    username: identity_app
    password: identity_app
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: identity

  liquibase:
    enabled: true
    change-log: classpath:/liquibase/changelog.xml
    # contexts property has to be overridden in production with the value pro
    contexts: dev,test

  kafka:
    bootstrap-servers: kafka.oms.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

springdoc:
  swagger-ui:
    doc-expansion: none
    operationsSorter: alpha
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

oms:
  kafka:
    topic:
      audit-events: oms.audit.events
