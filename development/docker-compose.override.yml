services:
  postgres:
    ports:
      - "5432:5432"

  auth:
    ports:
      - "8080:8080"

  kafka:
    ports:
      - "9094:9094"

  kafka-ui:
    ports:
      - "8090:8080"

  elasticsearch:
    ports:
      - "9200:9200"

  kibana:
    ports:
      - "5601:5601"

  redis:
    ports:
      - "6379:6379"

  aws:
    ports:
      - "4566:4566"

  identity-api:
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  order-api:
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  audit-log-api:
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  gateway-api:
    ports:
      - "8084:8084"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  storage-api:
    ports:
      - "8085:8085"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
