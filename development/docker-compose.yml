services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=secretPassword2022
    volumes:
      - ./docker-mounts/postgres/init-scripts:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      oms:
        aliases: [ database.oms.local ]

  auth:
    image: quay.io/keycloak/keycloak:24.0.4
    restart: always
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://database.oms.local:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=secretPassword2022
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    entrypoint: /opt/keycloak/bin/kc.sh start-dev --import-realm
    volumes:
      - ./docker-mounts/keycloak/oms-realm.json:/opt/keycloak/data/import/oms-realm.json
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      oms:
        aliases: [ auth.oms.local ]

  kafka:
    image: apache/kafka:3.7.0
    restart: always
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka.oms.local:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka.oms.local:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      oms:
        aliases: [ kafka.oms.local ]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=oms
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka.oms.local:9092
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      oms:
        aliases: [ kafka-ui.oms.local ]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      oms:
        aliases: [ elasticsearch.oms.local ]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch.oms.local:9200
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks:
      oms:
        aliases: [ kibana.oms.local ]
    profiles: [ observability ]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      oms:
        aliases: [ redis.oms.local ]

  aws:
    image: localstack/localstack:3.0
    restart: always
    environment:
      - SERVICES=s3
      - DEBUG=1
      - AWS_ACCESS_KEY_ID=testUser
      - AWS_SECRET_ACCESS_KEY=testAccessKey
      - AWS_DEFAULT_REGION=eu-west-2
      - PERSISTENCE=1
    volumes:
      - ./docker-mounts/localstack:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      oms:
        aliases: [ aws.oms.local ]

  identity-api:
    image: ${IDENTITY_SERVICE_IMAGE:-order-management/identity-service:latest}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      oms:
        aliases: [ identity.oms.local ]

  storage-api:
    image: ${STORAGE_SERVICE_IMAGE:-order-management/oms-storage-service:latest}
    restart: always
    depends_on:
      auth: { condition: service_healthy }
      aws: { condition: service_healthy }
    networks:
      oms:
        aliases: [ storage.oms.local ]

  order-api:
    image: ${ORDER_SERVICE_IMAGE:-order-management/order-service:latest}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
      kafka: { condition: service_healthy }
      storage-api: { condition: service_started }
    networks:
      oms:
        aliases: [ order.oms.local ]

  audit-log-api:
    image: ${AUDIT_LOG_SERVICE_IMAGE:-order-management/audit-log-service:latest}
    restart: always
    depends_on:
      auth: { condition: service_healthy }
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    networks:
      oms:
        aliases: [ audit-log.oms.local ]

  gateway-api:
    image: ${UI_SERVICE_IMAGE:-order-management/oms-ui-service:latest}
    restart: always
    depends_on:
      auth: { condition: service_healthy }
      identity-api: { condition: service_started }
      order-api: { condition: service_started }
      audit-log-api: { condition: service_started }
    networks:
      oms:
        aliases: [ gateway.oms.local ]

networks:
  oms:

volumes:
  postgres-data:
  elasticsearch-data:
  redis-data:
  localstack-data:
